<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pack Rush</title>
  <meta name="description" content="Open real Pokémon TCG booster packs from a rotating shop, sell your pulls and fill your binder.">
  <link rel="preconnect" href="https://api.pokemontcg.io">
  <link rel="preconnect" href="https://images.pokemontcg.io">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%23222' stroke-width='3'/%3E%3Cpath d='M2 16h28' stroke='%23222' stroke-width='3'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23e3350d' stroke='%23222' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23fff' stroke='%23222' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#shop"><span class="brand-ball"></span>Pack Rush</a>
    <nav class="tabs" id="tabs">
      <button data-view="shop">Shop</button>
      <button data-view="binder">Binder</button>
      <button data-view="collection">Collection</button>
      <button data-view="profile">Profile</button>
    </nav>
    <div class="wallet">
      <div class="balance" id="balance">$0.00</div>
      <div class="income" id="income">+$10 in --:--</div>
    </div>
  </header>
  <main id="view"></main>
  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/game.js"></script>
  <script src="js/components.js"></script>
  <script src="js/opener.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
