<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fc">
  <title>Pack Rush</title>
  <meta name="description" content="Open real Pokémon TCG booster packs from a rotating shop, sell your pulls and fill your binder.">
  <link rel="preconnect" href="https://api.pokemontcg.io">
  <link rel="preconnect" href="https://images.pokemontcg.io">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='2' width='20' height='28' rx='3' fill='%232f6bff'/%3E%3Crect x='9' y='5' width='14' height='22' rx='2' fill='none' stroke='%23ffcb05' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="appbar">
    <a class="logo" href="#shop" aria-label="Pack Rush home">
      <span class="logo__mark"><i></i></span>
      <span class="logo__word">Pack<b>Rush</b></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Main">
      <button data-view="shop"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span><span>Shop</span></button>
      <button data-view="binder"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z"/><path d="M9 3v18"/><path d="M12.5 8h3.5M12.5 12h3.5"/></svg></span><span>Binder</span></button>
      <button data-view="collection"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="12" height="16" rx="2"/><path d="M5 6.5v12A2.5 2.5 0 0 0 7.5 21H15"/></svg></span><span>Collection</span></button>
      <button data-view="earn"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg></span><span>Earn</span></button>
      <button data-view="profile"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>Profile</span></button>
    </nav>
    <div class="appbar__right">
      <div class="income" title="Hourly income">
        <div class="income__ring" id="incomeRing"><span>+$10</span></div>
        <div class="income__text"><span>Next in</span><b id="incomeText">--:--</b></div>
      </div>
      <div class="wallet" id="wallet"><span class="coin" aria-hidden="true">$</span><b id="balance">$0.00</b></div>
      <button class="icon-btn" id="soundBtn" aria-label="Mute sounds"></button>
    </div>
  </header>
  <main id="view" class="view"></main>
  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/game.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/components.js"></script>
  <script src="js/card.js"></script>
  <script src="js/opener.js"></script>
  <script src="js/grading.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
